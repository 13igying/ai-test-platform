# pytest 根配置（rootdir = 仓库根；tests/pytest.ini 已废弃删除）
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
junit_family = xunit2
addopts = -v --tb=short --strict-markers
markers =
    api: API 集成测试
    e2e: E2E 浏览器测试（Playwright）
    smoke: 冒烟测试，核心链路
    slow: 慢速测试（性能/异步等待）
    p1: 次优先级用例
    security: 安全测试（越权/注入/限流）
    integration: 集成链路测试（跨服务异步）
    unit: 框架/AI 模块离线单元测试
    ui: UI 自动化
